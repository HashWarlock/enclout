services:
  enclout:
    image: hashwarlock/enclout:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - ENCLOUT_AUTH_TOKEN=${ENCLOUT_AUTH_TOKEN}
      - ENCLOUT_SIGNING_KEY_B64=${ENCLOUT_SIGNING_KEY_B64}
      - ENCLOUT_CONNECTOR_ID=${ENCLOUT_CONNECTOR_ID:-}
      - ENCLOUT_LOG_FORMAT=json
      # Phala Cloud injects these automatically in every CVM.
      - DSTACK_APP_ID=${DSTACK_APP_ID}
      - DSTACK_GATEWAY_DOMAIN=${DSTACK_GATEWAY_DOMAIN}
    volumes:
      - enclout-data:/data
      - /var/run/dstack.sock:/var/run/dstack.sock

volumes:
  enclout-data:
